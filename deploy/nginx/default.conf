# nginx أمام Django/gunicorn.
# TLS: إن كان هناك proxy خارجي (مثل منصة الاستضافة) يُنهي TLS ويمرر X-Forwarded-Proto
# فسيُمرَّر كما هو؛ وإلا تُستخدم قيمة $scheme.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 210m;
    server_tokens off;

    # ترويسات الأمان العامة يضيفها Django؛ هنا فقط ما يخص /media/

    # ملفات الكتب لا تُخدم مباشرة أبدًا. الوصول (إن سُمح قانونيًا) يمر عبر Django.
    location ^~ /media/books/pdfs/ {
        return 404;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        # منع تنفيذ أي محتوى مرفوع كـ HTML/JS
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(login|register)/$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://django_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        proxy_pass http://django_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
