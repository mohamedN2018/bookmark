# تشغيل الاختبارات على PostgreSQL حقيقي:
#   docker compose -f docker-compose.test.yml run --rm tests
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maktaba_test
      POSTGRES_USER: maktaba
      POSTGRES_PASSWORD: maktaba-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maktaba -d maktaba_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    entrypoint: []
    command: sh -c "python -m ruff check . && python manage.py makemigrations --check --dry-run && python -m pytest -p no:cacheprovider"
    environment:
      DJANGO_SETTINGS_MODULE: book_project.settings_test
      DB_ENGINE: postgres
      POSTGRES_DB: maktaba_test
      POSTGRES_USER: maktaba
      POSTGRES_PASSWORD: maktaba-test-only
      POSTGRES_HOST: test-db
    depends_on:
      test-db:
        condition: service_healthy
