{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="الصفحات">
    {% if page_obj.has_previous %}<a class="btn btn-quiet" href="?{% if filter_querystring %}{{ filter_querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">السابق</a>{% endif %}
    <span class="muted">صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="btn btn-quiet" href="?{% if filter_querystring %}{{ filter_querystring }}&{% endif %}page={{ page_obj.next_page_number }}">التالي</a>{% endif %}
</nav>
{% endif %}
