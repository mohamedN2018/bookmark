# إضافات التشغيل المحلي فقط (لا يستخدمها Dokploy):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   ثم افتح http://localhost:8000
services:
  book_project:
    ports:
      - "${LOCAL_PORT:-8000}:8000"
    environment:
      # محليًا عبر HTTP: cookies غير Secure
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${LOCAL_PORT:-8000},http://127.0.0.1:${LOCAL_PORT:-8000}
